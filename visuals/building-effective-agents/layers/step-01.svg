<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 1084" width="1740" height="1084"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      @font-face { font-family: Virgil; src: url(data:font/woff2;base64,); }</style></defs><g stroke-opacity="0" fill-opacity="0" stroke-linecap="round" transform="translate(10 10) rotate(0 860 532)"><path d="M0 0 C344.01 0, 688.02 0, 1720 0 M0 0 C467.83 0, 935.66 0, 1720 0 M1720 0 C1720 250.18, 1720 500.36, 1720 1064 M1720 0 C1720 399.3, 1720 798.6, 1720 1064 M1720 1064 C1098.2 1064, 476.4 1064, 0 1064 M1720 1064 C1305.64 1064, 891.27 1064, 0 1064 M0 1064 C0 701.51, 0 339.02, 0 0 M0 1064 C0 689.98, 0 315.96, 0 0" stroke="transparent" stroke-width="1" fill="none"></path></g><g transform="translate(140 90) rotate(0 380 20)"><text x="0" y="26.43" font-family="Virgil, Segoe UI Emoji" font-size="30px" fill="#e8590c" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Building Effective Agents · 复杂度阶梯</text></g><g transform="translate(140 142) rotate(0 470 12)"><text x="0" y="14.977" font-family="Virgil, Segoe UI Emoji" font-size="17px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">核心论证：最成功的实现不靠复杂框架，而靠 simple, composable patterns —— 从「增强型 LLM」出发，按需逐级加复杂度。</text></g><g transform="translate(140 170) rotate(0 410 11)"><text x="0" y="13.215" font-family="Virgil, Segoe UI Emoji" font-size="15px" fill="#495057" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">地基分界：workflow = 预定义代码路径 (predefined code paths) · agent = 模型自定路径 (model-directed)。</text></g></svg>